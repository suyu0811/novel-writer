name: Build APK Only
on:
  workflow_dispatch:
  push:
    branches: [main]

    # ★ 新增：自动取消旧任务，只保留最新一次构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: 墨匣

jobs:
  android:
    name: Android arm64 签名包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 只安装 arm64 的 Rust 目标，避免多余的编译尝试
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 动态探测并配置 Android NDK 环境变量
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "错误：未在机器上找到自带的 NDK！"
            exit 1
          fi
          echo "探测到 NDK 路径为: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: 安装依赖
        run: |
          npm install
          npm install @tauri-apps/plugin-fs @tauri-apps/plugin-dialog @tauri-apps/plugin-store

      - name: Init Android 工程并赋权
        run: |
          npx tauri android init --ci
          chmod +x src-tauri/gen/android/gradlew
          
          # 强制修改 app 的 build.gradle，限制只编译 arm64-v8a
          BUILD_GRADLE="src-tauri/gen/android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            # 将 Tauri 默认包含的多种架构过滤为仅 arm64
            sed -i 's/abiFilters .*$/abiFilters "arm64-v8a"/g' "$BUILD_GRADLE"
          fi

      - name: Patch Gradle 阿里镜像
        run: |
          SETTINGS_FILE="src-tauri/gen/android/settings.gradle"
          BUILD_FILE="src-tauri/gen/android/build.gradle"
          for f in "$SETTINGS_FILE" "$BUILD_FILE"; do
            [ -f "$f" ] || continue
            # 只替换 maven 仓库地址，绝不改 Gradle 的 distributionUrl 版本！
            sed -i "s/google()/maven { url 'https:\/\/maven.aliyun.com\/repository\/google' }/g" "$f"
            sed -i "s/mavenCentral()/maven { url 'https:\/\/maven.aliyun.com\/repository\/public' }/g" "$f"
          done

      - name: 编译 arm64 APK
        run: npx tauri android build --apk --target aarch64

      - name: 准备签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -alias moxia \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass moxia2026 -keypass moxia2026 \
              -dname "CN=MoXia,O=MoXia,C=CN" > /dev/null 2>&1
            echo "KS_PASS=moxia2026" >> "$GITHUB_ENV"
            echo "NEW_KS=1" >> "$GITHUB_ENV"
            base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.b64"
          fi

      - name: Zipalign + Apksigner
        run: |
          BT_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          BT="$ANDROID_HOME/build-tools/$BT_VERSION"
          
          # 查找 Tauri 生成的 unsigned 包
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "错误：找不到生成的 unsigned APK，请检查编译日志！"
            exit 1
          fi
          
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "${{ env.APP_NAME }}-arm64.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "${{ env.APP_NAME }}-arm64.apk"

      - name: 上传签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-arm64.apk
          if-no-files-found: error

      - name: 上传证书备份
        if: env.NEW_KS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-备份
          path: ${{ runner.temp }}/keystore.b64
          if-no-files-found: warn
