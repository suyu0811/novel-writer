name: Build Tauri Novel App
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            cmdline-tools;latest
            platforms;android-34
            build-tools;34.0.0

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Install dependencies
        run: npm install

      - name: Build Android Debug
        run: |
          npx tauri android init
          npx tauri android build --debug
          echo "==== APK list ===="
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"

      - name: Upload Debug APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk

      - name: Print APK download URL
        run: echo "Debug APK: ${{ steps.upload-apk.outputs.artifact-url }}"

  build-windows:
    name: Build Windows full release folder
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Compile (no bundle)
        run: npx tauri build --no-bundle

      - name: Upload entire release directory
        id: upload-win
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-release
          path: src-tauri/target/release/

      - name: Print Windows artifact URL
        run: echo "Windows 完整包 URL: ${{ steps.upload-win.outputs.artifact-url }}"
