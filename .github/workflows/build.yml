name: Build 墨匣 轻简版

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: 墨匣

jobs:
  windows:
    name: Windows 轻简包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm install

      - name: 编译 + NSIS
        run: npx tauri build --bundles nsis

      - name: 打包便携版（直接取 release 文件）
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $outZip = "${{ env.APP_NAME }}-便携版.zip"

          $files = @()
          $exe = Get-ChildItem "$rel" -Filter *.exe -File | Select-Object -First 1
          if ($exe) { $files += $exe.FullName }
          if (Test-Path "$rel/WebView2Loader.dll") { $files += "$rel/WebView2Loader.dll" }
          if (Test-Path "$rel/resources") { $files += "$rel/resources" }

          if ($files.Count -ge 2) {
              Compress-Archive -Path $files -DestinationPath $outZip -Force
              Write-Host "✅ 便携包生成成功"
          } else {
              Write-Host "::warning::缺少必要文件，跳过便携包，不报错终止"
              exit 0
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-安装包
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传便携包
        uses: actions/upload-artifact@v4
        with:
          name: windows-便携版
          path: ${{ env.APP_NAME }}-便携版.zip
          if-no-files-found: warn

  android:
    name: Android arm64 签名包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: 安装依赖
        run: npm install

      - name: 编译 arm64 APK
        run: npx tauri android build --apk --target aarch64-linux-android

      - name: 准备签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -alias moxia \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass moxia2026 -keypass moxia2026 \
              -dname "CN=MoXia,O=MoXia,C=CN" > /dev/null 2>&1
            echo "KS_PASS=moxia2026" >> "$GITHUB_ENV"
            echo "NEW_KS=1" >> "$GITHUB_ENV"
            base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.b64"
          fi

      - name: Zipalign + Apksigner
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "${{ env.APP_NAME }}-arm64.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "${{ env.APP_NAME }}-arm64.apk"

      - name: 上传签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-arm64.apk
          if-no-files-found: error

      - name: 上传证书备份
        if: env.NEW_KS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-备份
          path: ${{ runner.temp }}/keystore.b64
          if-no-files-found: warn
