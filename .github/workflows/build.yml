name: Build Tauri Novel App
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            cmdline-tools;latest
            platforms;android-34
            build-tools;34.0.0

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install npm deps
        run: npm install

      - name: Tauri Android init & build
        run: |
          npx tauri android init
          npx tauri android build
          echo "=== List all generated APK ==="
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  build-windows:
    name: Build Windows bare EXE
    runs-on: windows-latest
    # 容错开关：就算 Windows 编译炸了，也不阻止整个 workflow 收尾，制品正常展示
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      - name: Build bare exe，跳过 NSIS 安装包
        run: npx tauri build --no-bundle

      - name: Upload bare Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-bare-exe
          path: src-tauri/target/release/*.exe
