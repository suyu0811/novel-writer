name: Build Both Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: 墨匣

jobs:
  # ================= 安卓打包 =================
  build-android:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 探测 NDK
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | head -n 1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: 安装依赖
        run: |
          npm install
          npm install @tauri-apps/plugin-fs @tauri-apps/plugin-dialog @tauri-apps/plugin-store

      - name: 编译 Android
        run: |
          npx tauri android init --ci
          chmod +x src-tauri/gen/android/gradlew
          BUILD_GRADLE="src-tauri/gen/android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/abiFilters .*$/abiFilters "arm64-v8a"/g' "$BUILD_GRADLE"
          fi
          SETTINGS_FILE="src-tauri/gen/android/settings.gradle"
          BUILD_FILE="src-tauri/gen/android/build.gradle"
          for f in "$SETTINGS_FILE" "$BUILD_FILE"; do
            [ -f "$f" ] || continue
            sed -i "s/google()/maven { url 'https:\/\/maven.aliyun.com\/repository\/google' }/g" "$f"
            sed -i "s/mavenCentral()/maven { url 'https:\/\/maven.aliyun.com\/repository\/public' }/g" "$f"
          done
          npx tauri android build --apk --target aarch64

      - name: 准备签名
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -keystore "$KS" -alias moxia -keyalg RSA -keysize 2048 -validity 36500 -storepass moxia2026 -keypass moxia2026 -dname "CN=MoXia,O=MoXia,C=CN" > /dev/null 2>&1
            echo "KS_PASS=moxia2026" >> $GITHUB_ENV
          fi

      - name: 签名
        run: |
          BT_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          BT="$ANDROID_HOME/build-tools/$BT_VERSION"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out "${{ env.APP_NAME }}-Android.apk" "$RUNNER_TEMP/aligned.apk"

      # ★ 修改了这里，生成的 ZIP 包名为：墨匣-安卓版-APK.zip
      - name: 上传 Android 包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-安卓版-APK
          path: ${{ env.APP_NAME }}-Android.apk
          if-no-files-found: error

  # ================= Windows (exe) 打包 =================
  build-windows:
    name: 打包 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: 安装依赖
        run: |
          npm install
          npm install @tauri-apps/plugin-fs @tauri-apps/plugin-dialog @tauri-apps/plugin-store

      - name: 编译 Windows
        run: npx tauri build

      # ★ 修改了这里，生成的 ZIP 包名为：墨匣-Windows版-EXE.zip
      - name: 上传 Windows 包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Windows版-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error