name: Build APK Only
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: 墨匣
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125

jobs:
  android:
    name: Android arm64 签名包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用官方维护的 android action，避开手写 yes 管道
      - name: Setup Android SDK (Base)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"

      - name: Install NDK
        run: |
          echo "Installing NDK 26.1.10909125..."
          # 使用 yes 自动接受许可协议
          yes | sdkmanager --install "ndk;26.1.10909125" || true
          # 确认 NDK 是否安装成功
          ls -la $ANDROID_HOME/ndk
          
      - name: 安装依赖
        run: npm install

      - name: Init Android 工程
        run: npx tauri android init --ci

      - name: Patch Gradle 阿里镜像
        run: |
          SETTINGS_FILE="src-tauri/gen/android/settings.gradle"
          BUILD_FILE="src-tauri/gen/android/build.gradle"
          for f in "$SETTINGS_FILE" "$BUILD_FILE"; do
            [ -f "$f" ] || continue
            # Tauri 2 生成的通常是 google() 和 mavenCentral() 简写
            sed -i "s/google()/maven { url 'https:\/\/maven.aliyun.com\/repository\/google' }/g" "$f"
            sed -i "s/mavenCentral()/maven { url 'https:\/\/maven.aliyun.com\/repository\/public' }/g" "$f"
          done
          # 顺手把 Gradle wrapper 指到腾讯镜像
          WRAPPER="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip#' "$WRAPPER"
          fi

      - name: 编译 arm64 APK
        run: npx tauri android build --apk --target aarch64-linux-android

      - name: 准备签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -alias moxia \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass moxia2026 -keypass moxia2026 \
              -dname "CN=MoXia,O=MoXia,C=CN" > /dev/null 2>&1
            echo "KS_PASS=moxia2026" >> "$GITHUB_ENV"
            echo "NEW_KS=1" >> "$GITHUB_ENV"
            base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.b64"
          fi

      - name: Zipalign + Apksigner
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "${{ env.APP_NAME }}-arm64.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "${{ env.APP_NAME }}-arm64.apk"

      - name: 上传签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-arm64.apk
          if-no-files-found: error

      - name: 上传证书备份
        if: env.NEW_KS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-备份
          path: ${{ runner.temp }}/keystore.b64
          if-no-files-found: warn
