name: Build MoXia
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: "墨匣"

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install
      - run: npm run build
      - run: npx tauri build

      - name: Zip portable
        run: |
          $src = "src-tauri/target/release/bundle/portable"
          $out = "${{ env.APP_NAME }}-便携版.zip"
          Compress-Archive -Path "$src/*" -DestinationPath "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_NAME }}-便携版.zip

  build-android:
    runs-on: ubuntu-latest
    name: Android arm64 Release
    needs: build-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            cmdline-tools;latest
            platforms;android-34
            build-tools;34.0.0

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - run: npm install
      - run: npm run build
      - name: Build APK
        run: npx tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/app-universal-release.apk
