name: Build APK Only
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: 墨匣
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  android:
    name: Android arm64 签名包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 使用官方维护的 android action，避开手写 yes 管道
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-34,build-tools;34.0.0"

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: 安装依赖
        run: npm install

      - name: Patch Gradle 阿里镜像
        run: |
          GRADLE_FILE="src-tauri/gen/android/build.gradle"
          SETTINGS_FILE="src-tauri/gen/android/settings.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/maven { url "https:\/\/maven.google.com" }/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' "$GRADLE_FILE"
          fi
          if [ -f "$SETTINGS_FILE" ]; then
            sed -i 's/maven { url "https:\/\/maven.google.com" }/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' "$SETTINGS_FILE"
          fi

      - name: 编译 arm64 APK
        run: npx tauri android build --apk --target aarch64-linux-android

      - name: 准备签名 keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$KS" -alias moxia \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass moxia2026 -keypass moxia2026 \
              -dname "CN=MoXia,O=MoXia,C=CN" > /dev/null 2>&1
            echo "KS_PASS=moxia2026" >> "$GITHUB_ENV"
            echo "NEW_KS=1" >> "$GITHUB_ENV"
            base64 -w0 "$KS" > "$RUNNER_TEMP/keystore.b64"
          fi

      - name: Zipalign + Apksigner
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "${{ env.APP_NAME }}-arm64.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "${{ env.APP_NAME }}-arm64.apk"

      - name: 上传签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-arm64.apk
          if-no-files-found: error

      - name: 上传证书备份
        if: env.NEW_KS == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-备份
          path: ${{ runner.temp }}/keystore.b64
          if-no-files-found: warn
