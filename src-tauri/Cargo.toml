[package]
name = "mo-xia"
version = "1.0.0"
description = "墨匣 · 本地小说写作"
authors = ["MoXia"]
edition = "2021"

[lib]
name = "mo_xia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
